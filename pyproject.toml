[project]
name = "wishly-telegram-bot"
version = "0.1.0"
description = "Telegram bot for creating and sharing wishlists"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "aiogram[redis] (>=3.32.0,<4.0.0)",
    "sqlalchemy[asyncio] (>=2.1.8,<2.2.0)",
    "alembic (>=1.20.1,<2.0.0)",
    "asyncpg (>=0.32.0,<0.33.0)",
    "apscheduler (>=3.11.3,<4.0.0)",
    "pydantic-settings (>=2.14.0,<3.0.0)",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
