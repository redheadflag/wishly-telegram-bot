name: wishly

x-bot-common: &bot-common
  build: .
  image: wishly-bot:latest
  env_file: .env
  environment:
    DB_HOST: postgres
    DB_PORT: 5432
    REDIS_HOST: redis
    REDIS_PORT: 6379
  logging: &logging
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  bot:
    <<: *bot-common
    restart: unless-stopped
    depends_on:
      migrations:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  migrations:
    <<: *bot-common
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME is not set}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is not set}
      POSTGRES_DB: ${DB_DATABASE:?DB_DATABASE is not set}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    # FSM state and scheduled jobs live in Redis, so persist them to disk
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging

volumes:
  postgres-data:
  redis-data:
